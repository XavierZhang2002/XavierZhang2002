name: Update Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # 11:00 China time
  push:
    branches: [main]
    paths:
      - 'metrics/config.json'
      - '.github/scripts/fetch_scholar.py'
      - '.github/workflows/scholar-metrics.yml'

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python .github/scripts/fetch_scholar.py

      - name: Publish to google-scholar-stats branch
        run: |
          set -euo pipefail
          for file in results/gs_data.json results/gs_data_shieldsio.json; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty, keeping the previous snapshot"
              exit 1
            fi
          done
          cd results
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ./*.json
          git commit -q -m 'Update Scholar metrics'
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:google-scholar-stats
          echo "published to google-scholar-stats"
